
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vice City - Open World Game</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#111;
}

canvas { display:block; }

#hud {
  position:fixed;
  top:20px;
  left:20px;
  color:white;
  background:#101010bb;
  padding:15px 20px;
  border-radius:10px;
  line-height:1.8;
  z-index:2;
}

#title {
  color:#00eaff;
  font-size:22px;
  font-weight:bold;
}

#help {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:#111b;
  padding:12px 20px;
  border-radius:8px;
  text-align:center;
  width:max-content;
  max-width:95%;
  font-size:13px;
}

#message {
  position:fixed;
  top:25%;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  font-size:20px;
  font-weight:bold;
  text-shadow:0 2px 5px black;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="hud">
  <div id="title">VICE CITY</div>
  <div>Health: <span id="health">100</span></div>
  <div>Money: $<span id="money">5000</span></div>
  <div>Mode: <span id="mode">Walking</span></div>
  <div>Speed: <span id="speed">0</span> km/h</div>
</div>

<div id="message">WELCOME TO VICE CITY</div>

<div id="help">
  W A S D = Move / Drive |
  SPACE = Jump / Brake |
  SHIFT = Run |
  E = Enter / Exit Car |
  Mouse = Camera
</div>

<script type="module">
import * as THREE from 'three';

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 500);

// CAMERA
const camera = new THREE.PerspectiveCamera(
  70, window.innerWidth/window.innerHeight, 0.1, 1000
);

// RENDERER
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xffffff,0x536078,2));

const sun = new THREE.DirectionalLight(0xffffff,3);
sun.position.set(100,150,80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

// MATERIALS
const materials = {
  road: new THREE.MeshStandardMaterial({color:0x25282e}),
  ground: new THREE.MeshStandardMaterial({color:0x477c48}),
  white: new THREE.MeshStandardMaterial({color:0xffffff}),
  yellow: new THREE.MeshStandardMaterial({color:0xffd600}),
  glass: new THREE.MeshStandardMaterial({
    color:0x4e9ab0, metalness:0.4, roughness:0.2
  })
};

// OBJECT HELPER
function box(w,h,d,color,x,y,z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color})
  );
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// GROUND
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000,1000),
  materials.ground
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.1;
ground.receiveShadow = true;
scene.add(ground);

// ROADS
function road(x,z,w,d) {
  const r = new THREE.Mesh(
    new THREE.BoxGeometry(w,0.08,d),
    materials.road
  );
  r.position.set(x,0,z);
  scene.add(r);
}

for(let i=-3;i<=3;i++){
  road(i*100,0,16,700);
  road(0,i*100,700,16);
}

// ROAD LINES
for(let i=-3;i<=3;i++){
  for(let j=-32;j<=32;j++){
    box(0.25,0.03,4,0xffd34e,i*100,0.06,j*10);
    box(4,0.03,0.25,0xffd34e,j*10,0.06,i*100);
  }
}

// BUILDINGS
const buildingColors = [
  0xe5b99a,0xaaaac9,0x8dabc2,
  0xd8c18e,0x9ca6a8,0xd4a3a3,
  0x8ba6a0
];

for(let x=-300;x<=300;x+=40){
  for(let z=-300;z<=300;z+=40){

    if(Math.abs(x%100)<22 || Math.abs(z%100)<22) continue;

    const width = 20+Math.random()*12;
    const depth = 20+Math.random()*12;
    const height = 15+Math.random()*65;

    const color = buildingColors[
      Math.floor(Math.random()*buildingColors.length)
    ];

    box(width,height,depth,color,x,height/2,z);

    // WINDOWS
    for(let y=5;y<height-3;y+=7){
      for(let a=-width/2+3;a<width/2-2;a+=6){
        const win = new THREE.Mesh(
          new THREE.BoxGeometry(2.5,3,0.2),
          new THREE.MeshStandardMaterial({
            color:0x83d5ed,
            emissive:0x17445b,
            emissiveIntensity:0.3
          })
        );
        win.position.set(x+a,y,z+depth/2+0.12);
        scene.add(win);
      }
    }
  }
}

// TREES
function tree(x,z){
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5,0.7,5),
    new THREE.MeshStandardMaterial({color:0x684326})
  );
  trunk.position.set(x,2.5,z);
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(3,8,8),
    new THREE.MeshStandardMaterial({color:0x167d39})
  );
  leaves.position.set(x,6,z);
  scene.add(leaves);
}

for(let i=0;i<100;i++){
  const x=(Math.random()-.5)*650;
  const z=(Math.random()-.5)*650;
  tree(x,z);
}

// PLAYER
const player = new THREE.Group();

const skin = new THREE.MeshStandardMaterial({color:0xe7ae82});
const shirt = new THREE.MeshStandardMaterial({color:0x13a4c7});
const pants = new THREE.MeshStandardMaterial({color:0x242d45});

function bodyPart(geo,mat,x,y,z){
  const m = new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  m.castShadow = true;
  player.add(m);
  return m;
}

bodyPart(new THREE.CapsuleGeometry(0.55,1,4,8),shirt,0,1.8,0);
bodyPart(new THREE.SphereGeometry(0.38,16,16),skin,0,2.85,0);
bodyPart(new THREE.BoxGeometry(0.32,1.1,0.35),pants,-0.28,0.65,0);
bodyPart(new THREE.BoxGeometry(0.32,1.1,0.35),pants,0.28,0.65,0);
bodyPart(new THREE.BoxGeometry(0.3,1.1,0.3),skin,-0.72,1.8,0);
bodyPart(new THREE.BoxGeometry(0.3,1.1,0.3),skin,0.72,1.8,0);

player.position.set(0,0,10);
scene.add(player);

// CAR CREATOR
function createCar(x,z,color){
  const car = new THREE.Group();

  const paint = new THREE.MeshStandardMaterial({
    color,metalness:0.65,roughness:0.25
  });

  const base = new THREE.Mesh(
    new THREE.BoxGeometry(4,1.2,7),paint
  );
  base.position.y=0.9;
  base.castShadow=true;
  car.add(base);

  const top = new THREE.Mesh(
    new THREE.BoxGeometry(3.2,1.2,3.5),
    materials.glass
  );
  top.position.set(0,2,0.3);
  car.add(top);

  for(const xw of [-1.8,1.8]){
    for(const zw of [-2.2,2.2]){
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.65,0.65,0.4,16),
        new THREE.MeshStandardMaterial({color:0x111111})
      );
      wheel.rotation.z=Math.PI/2;
      wheel.position.set(xw,0.65,zw);
      car.add(wheel);
    }
  }

  car.position.set(x,0,z);
  scene.add(car);
  return car;
}

// PLAYER CAR + TRAFFIC
const myCar = createCar(10,10,0xff3030);
myCar.visible = false;

const traffic=[];
const colors=[0xffffff,0x2222dd,0xffcc00,0x22aa66];

for(let i=0;i<12;i++){
  const c=createCar(
    -300+Math.random()*600,
    -300+Math.random()*600,
    colors[i%4]
  );
  traffic.push(c);
}

// INPUT
const keys={};
let inCar=false;
let speed=0;
let velocityY=0;
let jump=false;

window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.code==='Space') e.preventDefault();

  if(e.key.toLowerCase()==='e'){
    if(!inCar && player.position.distanceTo(myCar.position)<12){
      inCar=true;
      player.visible=false;
      myCar.visible=true;
      document.getElementById('mode').innerText='Driving';
    }else if(inCar){
      inCar=false;
      player.position.copy(myCar.position);
      player.position.x+=5;
      player.visible=true;
      myCar.visible=false;
      speed=0;
      document.getElementById('mode').innerText='Walking';
    }
  }
});

window.addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=false;
});

// CAMERA
const cameraOffset = new THREE.Vector3(0,8,15);
const lookTarget = new THREE.Vector3();

// GAME LOOP
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const delta=Math.min(clock.getDelta(),0.04);
  const forward=new THREE.Vector3();
  const direction=new THREE.Vector3();

  if(inCar){

    if(keys['w']) speed+=35*delta;
    if(keys['s']) speed-=35*delta;

    speed*=Math.pow(0.985,delta*60);
    speed=THREE.MathUtils.clamp(speed,-30,65);

    if(keys['a']) myCar.rotation.y+=1.8*delta;
    if(keys['d']) myCar.rotation.y-=1.8*delta;

    forward.set(
      Math.sin(myCar.rotation.y),
      0,
      Math.cos(myCar.rotation.y)
    );

    myCar.position.addScaledVector(forward,-speed*delta);

    document.getElementById('speed').innerText=
      Math.round(Math.abs(speed)*2);
  }else{

    let moveX=0,moveZ=0;

    if(keys['w']) moveZ-=1;
    if(keys['s']) moveZ+=1;
    if(keys['a']) moveX-=1;
    if(keys['d']) moveX+=1;

    direction.set(moveX,0,moveZ);

    if(direction.length()>0){
      direction.normalize();

      const walkSpeed=keys['shift']?18:9;

      player.position.addScaledVector(
        direction,walkSpeed*delta
      );

      player.rotation.y=Math.atan2(
        direction.x,direction.z
      );
    }

    if(keys[' '] && !jump){
      velocityY=11;
      jump=true;
    }

    velocityY-=25*delta;
    player.position.y+=velocityY*delta;

    if(player.position.y<0){
      player.position.y=0;
      velocityY=0;
      jump=false;
    }
  }

  // CAMERA FOLLOW
  const target=inCar?myCar.position:player.position;
  const rotation=inCar?myCar.rotation.y:player.rotation.y;

  const offset=new THREE.Vector3(
    Math.sin(rotation)*15,
    8,
    Math.cos(rotation)*15
  );

  const desired=target.clone().add(offset);
  camera.position.lerp(desired,Math.min(1,delta*5));

  lookTarget.copy(target);
  lookTarget.y+=2;
  camera.lookAt(lookTarget);

  // TRAFFIC MOVEMENT
  for(const c of traffic){
    c.position.x+=Math.sin(c.rotation.y)*delta*5;
    c.position.z+=Math.cos(c.rotation.y)*delta*5;
  }

  // HUD
  document.getElementById('speed').innerText=
    inCar?Math.round(Math.abs(speed)*2):'0';

  renderer.render(scene,camera);
}

animate();

// RESIZE
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// WELCOME MESSAGE
setTimeout(()=>{
  document.getElementById('message').style.display='none';
},3500);

</script>
</body>
</html>
